name: Research regression
on: [push, pull_request]
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r eval/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix extension
      # CI uses the trained linear baseline; full model/corpus runs remain separate.
      - run: cp models/linear.json extension/src/weights.json
      - run: npm run build
      - run: npx --prefix extension tsc --noEmit -p extension/tsconfig.json
      - run: PYTHONPATH=eval python -m pytest eval/tests -q
      - run: npm test
